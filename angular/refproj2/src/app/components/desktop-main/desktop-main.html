  <!-- Full width top section -->
<div class="top-container">
  <table class="data-table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Contact</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of payload" (click)="selectRow(item)">
        <td>{{ item.user.id }}</td>
        <td>{{ item.user.fullName }}</td>
        <td>{{ item.user.contact }}</td>
      </tr>
    </tbody>
  </table>
</div>
