<ng-container *ngIf="_state.appState$ | async as state">

  {{state.selectedUser | json}}

  <div class="desktop">
    <h2>Desktop Display</h2>
    <app-desktop-main [payload]="state.transformedPayload" (rowSelected)="handleRowSelected($event)"></app-desktop-main>
    <app-desktop-detail [details]="state.selectedUser"></app-desktop-detail>
  </div>

  <div class="tablet">
    <h2>Tablet Display</h2>
    {{state | json}}
  </div>

  <div class="mobile">
    <h2>Mobile Display</h2>
    <app-mobile [payload]="state.transformedPayload"></app-mobile>
  </div>

  <div>
    <h2>Notification centre</h2>
  </div>
</ng-container>
